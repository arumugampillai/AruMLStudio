[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arumlstudio"
version = "0.0.0"
description = "Aru ML Studio (apps packages under apps/)"
requires-python = ">=3.10"

# Lets `pip install -e .` expose master_dataset_tk, chain_replay_ml, etc. on the interpreter.
[tool.setuptools.packages.find]
where = ["apps"]

# PyCharm / Pyright / Pylance: same layout as master_dataset_manager.py runtime sys.path.
[tool.pyright]
include = ["apps", "master_dataset_manager.py", "ormp", "research", "tests"]
extraPaths = ["apps"]
pythonVersion = "3.12"
